<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#001235" />
    <title>流动蓝色丝绸光</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #001235;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .fallback {
        position: fixed;
        inset: 0;
        display: none;
        background:
          radial-gradient(80% 46% at 65% 108%, rgba(173, 224, 255, 0.72), transparent 48%),
          radial-gradient(80% 68% at 18% 96%, rgba(0, 103, 255, 0.95), transparent 68%),
          linear-gradient(160deg, #00112e 0%, #00246c 51%, #0651c8 100%);
      }

      .fallback.is-visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="silk" aria-label="缓慢流动的蓝色丝绸光渐变背景"></canvas>
    <div class="fallback" id="fallback" aria-hidden="true"></div>

    <script>
      (() => {
        const canvas = document.querySelector("#silk");
        const fallback = document.querySelector("#fallback");
        const gl = canvas.getContext("webgl", {
          alpha: false,
          antialias: false,
          depth: false,
          powerPreference: "high-performance",
        });

        if (!gl) {
          canvas.hidden = true;
          fallback.classList.add("is-visible");
          return;
        }

        const vertexSource = `
          attribute vec2 a_position;

          void main() {
            gl_Position = vec4(a_position, 0.0, 1.0);
          }
        `;

        const fragmentSource = `
          precision highp float;

          uniform vec2 u_resolution;
          uniform float u_time;
          uniform vec2 u_pointer;

          float hash(vec2 p) {
            p = fract(p * vec2(123.34, 456.21));
            p += dot(p, p + 45.32);
            return fract(p.x * p.y);
          }

          float noise(vec2 p) {
            vec2 i = floor(p);
            vec2 f = fract(p);
            f = f * f * (3.0 - 2.0 * f);
            return mix(
              mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x),
              mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0)), f.x),
              f.y
            );
          }

          float fbm(vec2 p) {
            float value = 0.0;
            float amplitude = 0.5;
            mat2 rotation = mat2(0.80, -0.60, 0.60, 0.80);

            for (int i = 0; i < 5; i++) {
              value += amplitude * noise(p);
              p = rotation * p * 2.03 + 11.7;
              amplitude *= 0.5;
            }

            return value;
          }

          float softRibbon(float distanceToCurve, float width) {
            float normalized = distanceToCurve / width;
            return exp(-normalized * normalized);
          }

          float flamePath(
            vec2 uv,
            float base,
            float slope,
            float amplitude,
            float frequency,
            float phase,
            float time
          ) {
            return base + slope * uv.x
              + sin(uv.x * frequency + phase + time) * amplitude
              + sin(uv.x * (frequency * 2.15) - phase * 0.7 - time * 0.62) * amplitude * 0.28;
          }

          void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            float aspect = u_resolution.x / u_resolution.y;
            float time = u_time * 0.62;

            // Rotate the field into the flame's lower-left to upper-right travel axis.
            vec2 direction = normalize(vec2(0.56, 0.83));
            vec2 normal = vec2(-direction.y, direction.x);
            vec2 q = uv - vec2(-0.12, -0.18);
            float along = dot(q, direction);
            float across = dot(q, normal);

            float broadNoise = fbm(vec2(
              along * 1.30 - time * 0.38,
              across * 1.75 + time * 0.17
            ));
            float detailNoise = fbm(vec2(
              along * 2.65 + time * 0.15,
              across * 3.10 - time * 0.22
            ));
            float edgeNoise = fbm(vec2(
              along * 5.10 - time * 0.28,
              across * 4.40 + time * 0.13
            ));

            float flameAlong = along + (detailNoise - 0.5) * 0.055;
            float flameAcross = across
              + (broadNoise - 0.5) * 0.205
              + sin(along * 3.25 - time * 1.18) * 0.058
              + sin(time * 0.73) * 0.045;

            // A shared body feeds three unequal tongues. Their tapered widths and
            // independently moving tips remove the previous parallel-ribbon rhythm.
            float root = smoothstep(-0.10, 0.12, flameAlong);
            float bodyCenter = 0.035
              + sin(flameAlong * 2.20 - time * 1.08) * 0.120
              + (broadNoise - 0.5) * 0.080;
            float bodyWidth = mix(0.72, 0.18, smoothstep(0.02, 1.16, flameAlong))
              * (0.77 + broadNoise * 0.34 + sin(time * 1.14 + flameAlong * 2.6) * 0.14);
            float bodyTip = 1.0 - smoothstep(
              0.72 + sin(time * 1.12) * 0.16,
              1.16 + sin(time * 1.12) * 0.22,
              flameAlong
            );
            float bodyBreath = 0.76 + sin(time * 1.06 + broadNoise * 3.0) * 0.24;
            float body = softRibbon(flameAcross - bodyCenter, bodyWidth) * root * bodyTip * bodyBreath;

            float center1 = -0.16
              + sin(flameAlong * 3.75 - time * 1.52) * 0.155
              + (detailNoise - 0.5) * 0.075;
            float width1 = mix(0.30, 0.030, smoothstep(0.12, 1.52, flameAlong))
              * (0.64 + edgeNoise * 0.48 + sin(time * 1.31 + flameAlong * 3.0) * 0.18);
            float end1 = 1.0 - smoothstep(
              1.07 + sin(time * 1.46) * 0.19,
              1.50 + sin(time * 1.46) * 0.24,
              flameAlong
            );
            float tongue1 = softRibbon(flameAcross - center1, width1) * root * end1;

            float center2 = 0.265
              + sin(flameAlong * 4.45 + time * 1.27 + 1.7) * 0.145
              + (broadNoise - 0.5) * 0.065;
            float width2 = mix(0.255, 0.026, smoothstep(0.10, 1.34, flameAlong))
              * (0.67 + detailNoise * 0.42 + sin(time * 1.08 + flameAlong * 3.6) * 0.16);
            float end2 = 1.0 - smoothstep(
              0.91 + sin(time * 1.31 + 1.2) * 0.18,
              1.34 + sin(time * 1.31 + 1.2) * 0.22,
              flameAlong
            );
            float tongue2 = softRibbon(flameAcross - center2, width2) * root * end2;

            float center3 = -0.425
              + sin(flameAlong * 5.10 - time * 1.39 + 2.4) * 0.125
              + (detailNoise - 0.5) * 0.060;
            float width3 = mix(0.235, 0.022, smoothstep(0.06, 1.14, flameAlong))
              * (0.63 + edgeNoise * 0.44 + sin(time * 1.52 + flameAlong * 4.0) * 0.17);
            float end3 = 1.0 - smoothstep(
              0.76 + sin(time * 1.62 + 2.2) * 0.17,
              1.16 + sin(time * 1.62 + 2.2) * 0.21,
              flameAlong
            );
            float tongue3Visibility = 0.56 + sin(time * 1.44 + 2.1) * 0.44;
            float tongue3 = softRibbon(flameAcross - center3, width3) * root * end3 * tongue3Visibility;

            float flame = clamp(max(body, max(tongue1, max(tongue2, tongue3))), 0.0, 1.0);

            // Dark internal cuts make the volume curl, split and recombine like fire.
            float gapCenter = 0.065
              + sin(flameAlong * 4.75 - time * 0.73 + 0.9) * 0.105;
            float gapWidth = mix(0.115, 0.030, smoothstep(0.16, 1.08, flameAlong));
            float gapWindow = smoothstep(0.18, 0.42, flameAlong)
              * (1.0 - smoothstep(0.93, 1.18, flameAlong));
            float gap = softRibbon(flameAcross - gapCenter, gapWidth) * gapWindow;
            flame = clamp(flame - gap * (0.28 + detailNoise * 0.20), 0.0, 1.0);

            float glow1 = softRibbon(flameAcross - center1, width1 * 2.20) * root * end1;
            float glow2 = softRibbon(flameAcross - center2, width2 * 2.15) * root * end2;
            float glow3 = softRibbon(flameAcross - center3, width3 * 2.10) * root * end3;
            float aura = clamp(body * 0.62 + glow1 * 0.44 + glow2 * 0.40 + glow3 * 0.36, 0.0, 1.0);

            float core1 = softRibbon(flameAcross - center1 - 0.012, width1 * 0.44) * root * end1;
            float core2 = softRibbon(flameAcross - center2 + 0.016, width2 * 0.40) * root * end2;
            float core3 = softRibbon(flameAcross - center3 - 0.010, width3 * 0.38) * root * end3;
            float core = clamp(max(core1, max(core2, core3)), 0.0, 1.0);

            vec3 deepBlue = vec3(0.001, 0.014, 0.035);
            vec3 navy = vec3(0.002, 0.055, 0.145);
            vec3 cobalt = vec3(0.000, 0.205, 0.670);
            vec3 electricBlue = vec3(0.000, 0.470, 1.000);
            vec3 cyanBlue = vec3(0.115, 0.690, 1.000);
            vec3 iceBlue = vec3(0.650, 0.825, 1.000);
            vec3 rose = vec3(0.900, 0.390, 0.650);
            vec3 peach = vec3(1.000, 0.675, 0.520);

            float ambient = 0.15 + broadNoise * 0.20
              + smoothstep(0.02, 0.92, 1.0 - uv.y) * 0.15;
            vec3 color = mix(deepBlue, navy, ambient);
            color += cobalt * aura * (0.44 + edgeNoise * 0.12);

            float blueBody = smoothstep(0.055, 0.72, flame);
            color = mix(color, electricBlue, blueBody * 0.80);

            float inner = smoothstep(0.30, 0.94, flame) * (0.76 + detailNoise * 0.24);
            color = mix(color, cyanBlue, inner * 0.40);
            color += iceBlue * core * 0.30;

            float whiteCore = pow(clamp(core, 0.0, 1.0), 1.65)
              * (0.78 + 0.22 * sin(flameAlong * 4.0 - time * 0.58));
            color = mix(color, vec3(0.95, 0.975, 1.0), whiteCore * 0.48);

            // The warm kernels drift inside the blue mass instead of tinting every tongue.
            float ember1 = core1 * exp(-pow((flameAlong - 0.88 - sin(time * 0.58) * 0.06) / 0.135, 2.0));
            float ember2 = core2 * exp(-pow((flameAlong - 0.69 + sin(time * 0.66) * 0.05) / 0.120, 2.0));
            float ember3 = core3 * exp(-pow((flameAlong - 0.54 - sin(time * 0.51) * 0.05) / 0.110, 2.0));
            color = mix(color, rose, clamp(ember1 * 0.52 + ember3 * 0.34, 0.0, 0.42));
            color = mix(color, peach, clamp(ember2 * 0.40, 0.0, 0.28));

            float pointerGlow = exp(-dot(
              (uv - u_pointer) * vec2(aspect, 1.0),
              (uv - u_pointer) * vec2(aspect, 1.0)
            ) * 4.0);
            color += vec3(0.01, 0.07, 0.17) * pointerGlow * 0.09;

            float topLeftShadow = smoothstep(0.42, 1.04, uv.y)
              * (1.0 - smoothstep(0.06, 0.78, uv.x));
            color *= 1.0 - topLeftShadow * 0.30;

            float vignette = smoothstep(1.12, 0.18, distance(uv, vec2(0.54, 0.50)));
            color *= 0.86 + vignette * 0.14;

            color = pow(max(color, 0.0), vec3(0.92));

            // Fine luminance grain is part of the supplied frames. Keep it additive
            // and low amplitude so it reads as texture, never as dead black pixels.
            float grainFrame = floor(u_time * 18.0);
            vec2 grainCell = floor(gl_FragCoord.xy * 0.58);
            float grain = hash(grainCell + vec2(grainFrame * 17.0, grainFrame * 31.0)) - 0.5;
            float luminance = dot(color, vec3(0.2126, 0.7152, 0.0722));
            color += grain * mix(0.052, 0.080, smoothstep(0.08, 0.82, luminance));
            color = clamp(color, 0.0, 1.0);

            gl_FragColor = vec4(color, 1.0);
          }
        `;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            throw new Error(gl.getShaderInfoLog(shader) || "Shader compile failed");
          }
          return shader;
        }

        let program;
        try {
          program = gl.createProgram();
          gl.attachShader(program, compileShader(gl.VERTEX_SHADER, vertexSource));
          gl.attachShader(program, compileShader(gl.FRAGMENT_SHADER, fragmentSource));
          gl.linkProgram(program);
          if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
            throw new Error(gl.getProgramInfoLog(program) || "Shader link failed");
          }
        } catch (error) {
          console.error(error);
          canvas.hidden = true;
          fallback.classList.add("is-visible");
          return;
        }

        const positions = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, positions);
        gl.bufferData(
          gl.ARRAY_BUFFER,
          new Float32Array([-1, -1, 3, -1, -1, 3]),
          gl.STATIC_DRAW,
        );

        const position = gl.getAttribLocation(program, "a_position");
        const resolution = gl.getUniformLocation(program, "u_resolution");
        const time = gl.getUniformLocation(program, "u_time");
        const pointer = gl.getUniformLocation(program, "u_pointer");
        const pointerTarget = { x: 0.64, y: 0.12 };
        const pointerCurrent = { ...pointerTarget };
        const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
        let width = 0;
        let height = 0;
        let animationFrame = 0;
        let startTime = performance.now();

        function resize() {
          const dpr = Math.min(devicePixelRatio || 1, 1.5);
          const nextWidth = Math.max(1, Math.round(innerWidth * dpr));
          const nextHeight = Math.max(1, Math.round(innerHeight * dpr));
          if (nextWidth === width && nextHeight === height) return;
          width = canvas.width = nextWidth;
          height = canvas.height = nextHeight;
          gl.viewport(0, 0, width, height);
        }

        function render(now) {
          resize();
          pointerCurrent.x += (pointerTarget.x - pointerCurrent.x) * 0.025;
          pointerCurrent.y += (pointerTarget.y - pointerCurrent.y) * 0.025;

          gl.useProgram(program);
          gl.bindBuffer(gl.ARRAY_BUFFER, positions);
          gl.enableVertexAttribArray(position);
          gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
          gl.uniform2f(resolution, width, height);
          gl.uniform1f(time, reducedMotion.matches ? 0 : (now - startTime) / 1000);
          gl.uniform2f(pointer, pointerCurrent.x, pointerCurrent.y);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          if (!reducedMotion.matches) animationFrame = requestAnimationFrame(render);
        }

        function restart() {
          cancelAnimationFrame(animationFrame);
          startTime = performance.now();
          render(startTime);
        }

        addEventListener("pointermove", (event) => {
          pointerTarget.x = event.clientX / innerWidth;
          pointerTarget.y = 1 - event.clientY / innerHeight;
        }, { passive: true });
        addEventListener("resize", resize, { passive: true });
        reducedMotion.addEventListener("change", restart);
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) cancelAnimationFrame(animationFrame);
          else restart();
        });

        render(startTime);
      })();
    </script>
  </body>
</html>
